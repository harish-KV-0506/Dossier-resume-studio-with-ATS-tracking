<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Dossier – resume studio with ATS tracking</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--a:#4f2bd8;--bg:#fff;--fg:#0a0a0a;--mu:#5f5f68;--ln:#dcdce0;--cd:#f4f4f6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a0a0a;--fg:#f5f5f5;--mu:#a2a2ac;--ln:#2d2d33;--cd:#17171a}}
:root[data-theme="dark"]{--bg:#0a0a0a;--fg:#f5f5f5;--mu:#a2a2ac;--ln:#2d2d33;--cd:#17171a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 "DM Sans",system-ui,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
h1,h2,h3,.br{font-family:"Bricolage Grotesque",system-ui,sans-serif;margin:0}
header#top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:2px solid var(--fg);display:flex;align-items:center;gap:14px;padding:10px 20px}
.br{font-size:22px;font-weight:800}.br i{font-style:normal;background:var(--a);color:#fff;padding:0 7px;margin-right:2px}
nav{display:flex;gap:2px;overflow-x:auto;flex:1}nav button{background:none;border:0;color:var(--fg);font:500 14px "DM Sans";padding:7px 11px;cursor:pointer;white-space:nowrap}
nav button.on{background:var(--fg);color:var(--bg)}
.sw{display:flex;gap:6px;align-items:center}.sw b{width:18px;height:18px;border-radius:50%;border:2px solid var(--fg);cursor:pointer}
.w{max-width:1280px;margin:auto;padding:24px 20px 60px}
button,input,select,textarea{font:inherit;color:inherit}
.btn{background:var(--a);color:#fff;border:2px solid var(--a);padding:9px 16px;font-weight:700;cursor:pointer}
.btn.k{background:transparent;color:var(--fg);border-color:var(--fg)}.btn.s{padding:4px 10px;font-size:13px}
:focus-visible{outline:3px solid var(--a);outline-offset:2px}
input,select,textarea{width:100%;background:var(--bg);border:1.5px solid var(--ln);padding:7px 9px;border-radius:0}
input:focus,textarea:focus,select:focus{border-color:var(--a)}
label{display:block;font-size:12px;color:var(--mu);margin:8px 0 0}label input,label textarea{margin-top:3px;color:var(--fg);font-size:14px}
input[type=range]{padding:0;accent-color:var(--a)}input[type=color]{padding:0;height:34px;width:48px}
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:center;padding:30px 0 50px}
.hero h1{font-size:clamp(38px,6vw,76px);line-height:1;font-weight:800;letter-spacing:-.03em}
.hero p{font-size:18px;color:var(--mu);max-width:520px;margin:18px 0 24px}
.stage{background:var(--a);padding:26px;display:flex;justify-content:center}.th{overflow:hidden;box-shadow:8px 8px 0 var(--fg);background:#fff}
.feat{border-top:2px solid var(--fg)}.feat div{display:grid;grid-template-columns:230px 1fr auto;gap:16px;padding:16px 0;border-bottom:1px solid var(--ln);align-items:center}
.feat b{font:800 20px "Bricolage Grotesque"}.feat span{color:var(--mu)}
.two{display:grid;grid-template-columns:minmax(300px,420px) 1fr;gap:28px;align-items:start}
.ed{max-height:calc(100vh - 90px);overflow:auto;padding-right:8px}.ed h3{margin:20px 0 4px;font-size:18px;border-top:2px solid var(--fg);padding-top:10px}
.blk{border-left:4px solid var(--a);padding-left:10px;margin:10px 0}.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.gh{background:none;border:1.5px dashed var(--mu);padding:6px 10px;cursor:pointer;margin:6px 6px 0 0}.lk{background:none;border:0;color:var(--mu);text-decoration:underline;cursor:pointer;padding:4px 0}
.tb{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:end;border:2px solid var(--fg);padding:12px;margin-bottom:14px}.tb label{margin:0;min-width:90px}
.pvw{width:100%;background:var(--cd);overflow:hidden;position:relative}#pp{width:794px;transform-origin:0 0}
.col{display:grid;grid-template-columns:1fr 1fr;gap:28px}.card{border:2px solid var(--fg);padding:16px}.card h3{font-size:20px;margin-bottom:8px}
.chip{display:inline-block;border:1.5px solid var(--fg);padding:2px 9px;margin:3px 4px 0 0;font-size:13px;cursor:pointer;background:none}
.chip.ok{background:var(--fg);color:var(--bg);cursor:default}.chip.no{border-style:dashed}.chip.no:hover{background:var(--a);color:#fff;border-color:var(--a)}
.ring{width:96px;height:96px;border-radius:50%;background:conic-gradient(var(--a) calc(var(--p)*1%),var(--ln) 0);display:grid;place-items:center;flex:none}
.ring b{background:var(--bg);width:74px;height:74px;border-radius:50%;display:grid;place-items:center;font:800 22px "Bricolage Grotesque"}
.bar{height:8px;background:var(--ln);margin:2px 0 10px}.bar i{display:block;height:100%;background:var(--a)}
.ck{margin:4px 0;font-size:14px}.ck:before{content:"✓ ";color:var(--a);font-weight:800}.ck.x:before{content:"✗ ";color:#c0102b}
.board{display:grid;grid-template-columns:repeat(6,minmax(190px,1fr));gap:10px;overflow-x:auto}.board>div{background:var(--cd);padding:10px;min-height:200px}
.board h3{font-size:15px;margin-bottom:8px}.app{background:var(--bg);border:1.5px solid var(--fg);padding:8px;margin-bottom:8px;font-size:13px}.app select{padding:3px;font-size:12px;margin-top:4px}
.stats{display:flex;gap:28px;flex-wrap:wrap;margin:10px 0 18px}.stats b{display:block;font:800 34px "Bricolage Grotesque"}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:18px}.gal button{background:none;border:2px solid var(--ln);padding:10px;text-align:left;cursor:pointer}.gal button.on{border-color:var(--a);outline:2px solid var(--a)}
#toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 16px;display:none;z-index:40}
.sub{color:var(--mu);margin:4px 0 18px}
.dash-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:18px 0 28px}
.dash-stat{border:2px solid var(--fg);padding:16px;background:var(--cd);transform-style:preserve-3d;transition:transform .2s,box-shadow .2s}
.dash-stat:hover{transform:translateY(-4px) rotateX(2deg);box-shadow:5px 5px 0 var(--a)}
.dash-stat b{display:block;font:800 32px "Bricolage Grotesque"}
.dash-stat span,.app small{color:var(--mu)}
.dash-panels{display:grid;grid-template-columns:1.2fr .8fr;gap:14px;margin:16px 0 28px}
.dash-panels .card{min-width:0}
.stage{perspective:1100px}
.stage .th{transform:rotateY(var(--ry,0deg)) rotateX(var(--rx,0deg));transform-style:preserve-3d;transition:transform .15s ease-out;will-change:transform}
.stage .th:hover{transform:rotateY(var(--ry,0deg)) rotateX(var(--rx,0deg)) translate(-3px,-3px)}
.app input{font-size:12px;padding:4px 6px;margin-top:5px}
.tracker-tools{display:flex;gap:10px;align-items:end;flex-wrap:wrap;margin:14px 0}
.tracker-tools label{min-width:180px;flex:1}
.empty{color:var(--mu);padding:12px 0}
@media(max-width:860px){.hero,.two,.col{grid-template-columns:1fr}.feat div{grid-template-columns:1fr}.ed{max-height:none}header#top{flex-wrap:wrap}}
@media(max-width:700px){.dash-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.dash-panels{grid-template-columns:1fr}}
@media(prefers-reduced-motion:no-preference){.th{transition:transform .2s}.th:hover{transform:translate(-3px,-3px)}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;transition-duration:.01ms!important}}
/* resume paper */
.paper{width:794px;min-height:1123px;background:#fff;color:#111;line-height:1.4;padding:var(--m);text-align:left;font-family:Helvetica,Arial,sans-serif}
.paper h1{font-size:2.3em;line-height:1.1;margin:0;font-family:inherit}.paper .ti{font-size:1.15em;margin-top:2px}.paper .ct{margin-top:6px;opacity:.8}
.paper section{margin-top:calc(var(--g)*1.4)}.paper h2{font:inherit;font-weight:700;font-size:1em;letter-spacing:.08em;text-transform:uppercase;margin:0 0 5px}
.paper .it{margin-bottom:var(--g);break-inside:avoid}.paper .h{display:flex;justify-content:space-between;gap:12px}.paper .o{opacity:.75}
.paper ul{margin:4px 0 0;padding-left:18px}.paper p{margin:0}
.t-classic header{text-align:center;border-bottom:2px solid var(--a);padding-bottom:10px}.t-classic h2{color:var(--a);border-bottom:1px solid #ddd;padding-bottom:2px}
.t-minimal h1{color:var(--a)}.t-minimal h2{color:#555}.t-minimal section{border-left:3px solid var(--a);padding-left:12px}
.t-bold header{background:#0a0a0a;color:#fff;margin:calc(var(--m)*-1) calc(var(--m)*-1) 0;padding:var(--m);border-bottom:6px solid var(--a)}
.t-bold h2{background:var(--a);color:#fff;display:inline-block;padding:1px 8px}
.t-ats h2{border-bottom:1px solid #000}.t-ats *{color:#000!important}
.t-modern{display:grid;grid-template-columns:32% 1fr;padding:0}.t-modern aside{background:var(--a);color:#fff;padding:var(--m)}.t-modern .mn{padding:var(--m)}
.t-modern aside h2{border-bottom:1px solid rgba(255,255,255,.5);padding-bottom:3px}.t-modern .mn h2{color:var(--a)}.t-modern aside p{margin:3px 0;word-break:break-word}
@media print{body>*:not(#ph){display:none!important}#ph{display:block!important;position:static!important}}
</style></head><body>
<header id="top"></header><main id="app" class="w"></main><div id="toast" role="status"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<script>
const $=(s,e=document)=>e.querySelector(s),esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])),uid=()=>Math.random().toString(36).slice(2,8);
const blank=()=>({name:"",title:"",email:"",phone:"",loc:"",link:"",summary:"",exp:[],edu:[],skills:"",proj:[],extra:[]});
const demo=()=>({name:"Alex Rivera",title:"Product Analyst",email:"alex@example.com",phone:"+1 555 010 2030",loc:"Austin, TX",link:"linkedin.com/in/alexrivera",summary:"Analyst with 4 years turning messy data into product decisions. Comfortable with SQL, experimentation and stakeholder storytelling.",exp:[{role:"Product Analyst",org:"Northwind Labs",dates:"2022 – Present",desc:"Built weekly KPI dashboards used by 6 teams\nRan 14 A/B tests that lifted activation by 9%\nCut reporting time by 40% by automating SQL pipelines"}],edu:[{role:"B.S. Statistics",org:"University of Texas",dates:"2018 – 2022",desc:""}],skills:"SQL, Python, Tableau, A/B testing, Excel, Stakeholder management",proj:[],extra:[]});
let S=(()=>{try{const d=JSON.parse(localStorage.getItem("dossier1")||"null");if(d&&d.cvs)return d}catch(e){}return{cvs:[{id:uid(),name:"My CV",r:demo()}],cur:0,tpl:"classic",accent:"#4f2bd8",font:"Helvetica, Arial, sans-serif",size:10.5,gap:10,margin:36,custom:[],apps:[],theme:"royal",dark:null}})();
const save=()=>{try{localStorage.setItem("dossier1",JSON.stringify(S))}catch(e){}},R=()=>S.cvs[S.cur].r;
const THEMES={royal:"#4f2bd8",ruby:"#c0102b",emerald:"#0a7d55",saffron:"#b45f00",mono:"#0a0a0a"};
const TPL={classic:["Classic","Centered header, accent rule"],modern:["Modern","Colour sidebar, two columns"],minimal:["Minimal","Airy, accent name and rails"],bold:["Bold","Black masthead, colour tabs"],ats:["ATS plain","Single column, pure black"]};
const FONTS={"Helvetica, Arial, sans-serif":"Sans","Georgia, serif":"Serif","Trebuchet MS, sans-serif":"Humanist","Courier New, monospace":"Mono"};
let page="home",A=null;
function toast(m){const t=$("#toast");t.textContent=m;t.style.display="block";clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display="none",2600)}
function skl(r){return r.skills.split(/[,;\n]/).map(x=>x.trim()).filter(Boolean)}
const bl=t=>{const l=(t||"").split("\n").map(x=>x.trim()).filter(Boolean);return l.length?"<ul>"+l.map(x=>"<li>"+esc(x.replace(/^[-•*]\s*/,""))+"</li>").join("")+"</ul>":""};
const its=a=>a.map(i=>`<div class="it"><div class="h"><b>${esc(i.role)}</b><span>${esc(i.dates)}</span></div><div class="o">${esc(i.org)}</div>${bl(i.desc)}</div>`).join("");
const sec=(t,b)=>b?`<section><h2>${t}</h2>${b}</section>`:"";
function paper(r,o){const sk=skl(r),ct=[r.email,r.phone,r.loc,r.link].filter(Boolean).map(esc);
 const sum=sec("Summary",r.summary&&`<p>${esc(r.summary)}</p>`),ex=sec("Experience",its(r.exp)),ed=sec("Education",its(r.edu)),pr=sec("Projects",its(r.proj)),xt=r.extra.map(x=>sec(esc(x.t||"Section"),bl(x.b))).join("");
 const st=`style="--a:${o.accent};--m:${o.margin}px;--g:${o.gap}px;font-size:${o.size}px;font-family:${o.font}"`;
 if(o.tpl==="modern")return`<div class="paper t-modern" ${st}><aside><h1>${esc(r.name)}</h1><div class="ti">${esc(r.title)}</div>${sec("Contact",ct.map(c=>`<p>${c}</p>`).join(""))}${sec("Skills",sk.map(c=>`<p>${esc(c)}</p>`).join(""))}${ed}</aside><div class="mn">${sum}${ex}${pr}${xt}</div></div>`;
 return`<div class="paper t-${o.tpl}" ${st}><header><h1>${esc(r.name)}</h1><div class="ti">${esc(r.title)}</div><div class="ct">${ct.join(" • ")}</div></header>${sum}${ex}${ed}${sec("Skills",sk.length?`<p>${sk.map(esc).join(", ")}</p>`:"")}${pr}${xt}</div>`}
function thumb(o,k){return`<div class="th" style="width:${794*k}px;height:${1123*k}px"><div style="width:794px;transform:scale(${k});transform-origin:0 0">${paper(R(),o)}</div></div>`}
function fit(){const p=$("#pp"),w=$("#pvw");if(!p||!w)return;const k=Math.min(1,w.clientWidth/794);p.style.transform=`scale(${k})`;w.style.height=p.offsetHeight*k+"px"}
function draw(){const p=$("#pp");if(p){p.innerHTML=paper(R(),S);fit()}}
addEventListener("resize",fit);
/* ---------- pages ---------- */
function head(){const n=[["home","Dashboard"],["create","Create"],["update","Update & import"],["recommend","Recommend"],["tracker","ATS tracker"],["templates","Templates"]];
 $("#top").innerHTML=`<span class="br"><i>D</i>ossier</span><nav>${n.map(x=>`<button data-a="go" data-v="${x[0]}" class="${page===x[0]?"on":""}">${x[1]}</button>`).join("")}</nav><div class="sw">${Object.entries(THEMES).map(([k,c])=>`<b data-a="theme" data-v="${k}" title="${k}" style="background:${c}"></b>`).join("")}<button class="btn k s" data-a="dark">Light/Dark</button></div>`}
function applyTheme(){const d=document.documentElement;d.style.setProperty("--a",THEMES[S.theme]||THEMES.royal);if(S.dark)d.dataset.theme=S.dark;else d.removeAttribute("data-theme")}
const FEAT=[["Create","Fill in a guided editor and watch the page update live.","create"],["Update & import","Paste an old resume or upload LinkedIn export files.","update"],["Recommend","Paste a job description to see keyword gaps and role fit.","recommend"],["ATS tracker","Score every application and move it through stages.","tracker"],["Templates","Five built-in layouts plus your own saved ones.","templates"]];
function home(){const apps=S.apps||[],active=apps.filter(x=>!["Rejected","Offer"].includes(x.st)).length,interviews=apps.filter(x=>x.st==="Interview").length,avg=apps.length?Math.round(apps.reduce((n,x)=>n+(Number(x.score)||0),0)/apps.length):0;
 const soon=apps.filter(x=>x.followUp&&new Date(`${x.followUp}T00:00:00`)>=new Date(new Date().toDateString())&&new Date(`${x.followUp}T00:00:00`)-new Date()<7*864e5).sort((a,b)=>a.followUp.localeCompare(b.followUp));
 return`<section class="hero"><div><h1>Match the job before you apply.</h1><p>Build polished resumes, tailor each version to a role, and keep your job search moving with a clear application dashboard.</p><button class="btn" data-a="go" data-v="create">Build a resume</button> <button class="btn k" data-a="go" data-v="tracker">Track applications</button></div><div class="stage">${thumb(S,.46)}</div></section><div class="dash-grid"><div class="dash-stat"><b>${apps.length}</b><span>Applications tracked</span></div><div class="dash-stat"><b>${active}</b><span>Active opportunities</span></div><div class="dash-stat"><b>${interviews}</b><span>Interviews</span></div><div class="dash-stat"><b>${avg}%</b><span>Average keyword match</span></div></div><div class="dash-panels"><section class="card"><h3>Follow-ups this week</h3>${soon.length?soon.slice(0,5).map(x=>`<p><b>${esc(x.co||"Company")}</b> · ${esc(x.role||"Role")}<br><small>${esc(x.followUp)}</small></p>`).join(""):`<p class="empty">No follow-ups due this week. Add a date to an application to see reminders here.</p>`}<button class="btn k s" data-a="go" data-v="tracker">Open tracker</button></section><section class="card"><h3>Quick start</h3><p class="sub">Pick up where you left off.</p><p><b>Current resume:</b> ${esc(S.cvs[S.cur]?.name||"My CV")}</p><p><button class="btn" data-a="go" data-v="create">Continue editing</button></p><p><button class="btn k s" data-a="go" data-v="recommend">Check job match</button> <button class="btn k s" data-a="go" data-v="update">Import resume</button></p></section></div><div class="feat">${FEAT.map(f=>`<div><b>${f[0]}</b><span>${f[1]}</span><button class="btn k s" data-a="go" data-v="${f[2]}">Open</button></div>`).join("")}</div>`}
function ed(){const r=R(),f=(l,k,v,ta)=>`<label>${l}${ta?`<textarea data-k="${k}" rows="3">${esc(v)}</textarea>`:`<input data-k="${k}" value="${esc(v)}">`}</label>`;
 const ls=(key,lab,a)=>`<h3>${lab}</h3>`+a.map((x,i)=>`<div class="blk"><div class="row2">${f("Title",`${key}.${i}.role`,x.role)}${f("Organisation",`${key}.${i}.org`,x.org)}</div>${f("Dates",`${key}.${i}.dates`,x.dates)}${f("Bullets, one per line",`${key}.${i}.desc`,x.desc,1)}<button class="lk" data-a="del" data-v="${key}.${i}">Remove</button></div>`).join("")+`<button class="gh" data-a="add" data-v="${key}">+ Add</button>`;
 return`<div class="row2">${f("Full name","name",r.name)}${f("Headline","title",r.title)}${f("Email","email",r.email)}${f("Phone","phone",r.phone)}${f("Location","loc",r.loc)}${f("Link","link",r.link)}</div>${f("Summary","summary",r.summary,1)}${ls("exp","Experience",r.exp)}${ls("edu","Education",r.edu)}<h3>Skills</h3>${f("Comma separated","skills",r.skills,1)}${ls("proj","Projects",r.proj)}<h3>Extra sections</h3>${r.extra.map((x,i)=>`<div class="blk">${f("Section title",`extra.${i}.t`,x.t)}${f("Content, one per line",`extra.${i}.b`,x.b,1)}<button class="lk" data-a="del" data-v="extra.${i}">Remove</button></div>`).join("")}<div>${["Certifications","Awards","Publications","Languages","Volunteering","Interests"].map(t=>`<button class="gh" data-a="addx" data-v="${t}">+ ${t}</button>`).join("")}<button class="gh" data-a="add" data-v="extra">+ Custom</button></div>`}
function create(){return`<div class="tb"><label>CV<select data-s="cv">${S.cvs.map((c,i)=>`<option value="${i}" ${i==S.cur?"selected":""}>${esc(c.name)}</option>`).join("")}</select></label><label>Rename<input data-n value="${esc(S.cvs[S.cur].name)}"></label><button class="btn k s" data-a="newcv">New CV</button><button class="btn k s" data-a="dupcv">Duplicate</button><button class="btn k s" data-a="delcv">Delete</button></div><div class="two"><div class="ed">${ed()}</div><div><div class="tb"><label>Template<select data-s="tpl">${Object.entries(TPL).map(([k,v])=>`<option value="${k}" ${k==S.tpl?"selected":""}>${v[0]}</option>`).join("")}</select></label><label>Colour<input type="color" data-o="accent" value="${S.accent}"></label><label>Font<select data-s="font">${Object.entries(FONTS).map(([k,v])=>`<option value="${k}" ${k==S.font?"selected":""}>${v}</option>`).join("")}</select></label><label>Text size<input type="range" data-o="size" min="9" max="13" step=".5" value="${S.size}"></label><label>Spacing<input type="range" data-o="gap" min="4" max="20" value="${S.gap}"></label><label>Margins<input type="range" data-o="margin" min="20" max="64" value="${S.margin}"></label><button class="btn" data-a="pdf">Download PDF</button><button class="btn k" data-a="print">Print</button><button class="btn k" data-a="json">Save JSON</button></div><div class="pvw" id="pvw"><div id="pp">${paper(R(),S)}</div></div></div></div>`}
function update(){return`<h2>Update & import</h2><p class="sub">Bring existing data in, then refine it in Create. Imports become a new CV, so nothing is overwritten.</p><div class="col"><div class="card"><h3>Old resume</h3><p class="sub">Paste the text of your old resume, or upload a .txt, .md or .json file.</p><textarea id="old" rows="12" placeholder="Paste resume text here"></textarea><p><button class="btn" data-a="importtxt">Create CV from text</button></p><label>Upload a file<input type="file" id="fl" accept=".txt,.md,.json,.csv" multiple></label></div><div class="card"><h3>LinkedIn profile</h3><p class="sub">LinkedIn doesn’t let outside pages read an account directly, so use your official data export: Settings → Data privacy → Get a copy of your data → pick Profile, Positions, Education and Skills. Upload the CSV files below (select several at once).</p><label>LinkedIn CSV files<input type="file" id="li" accept=".csv" multiple></label><p class="sub">No export yet? Copy your LinkedIn About, Experience and Skills text into the box on the left and import it as text.</p></div></div>`}
/* parsing */
function csv(t){const rows=[];let r=[],c="",q=0;for(let i=0;i<t.length;i++){const ch=t[i];if(q){if(ch=='"'&&t[i+1]=='"'){c+='"';i++}else if(ch=='"')q=0;else c+=ch}else if(ch=='"')q=1;else if(ch==","){r.push(c);c=""}else if(ch=="\n"){r.push(c);rows.push(r);r=[];c=""}else if(ch!="\r")c+=ch}if(c||r.length){r.push(c);rows.push(r)}const h=rows.shift()||[];return rows.filter(x=>x.length>1).map(x=>Object.fromEntries(h.map((k,i)=>[k.trim(),(x[i]||"").trim()])))}
const DR=/((?:[A-Za-z]{3,9}\.? )?(?:19|20)\d\d)\s*(?:-|–|—|to)\s*((?:[A-Za-z]{3,9}\.? )?(?:19|20)\d\d|present|current)/i;
function blocks(lines){const out=[];let c=[];lines.concat("").forEach(x=>{if(x)c.push(x);else if(c.length){out.push(c);c=[]}});return out.map(b=>{let d="";b=b.map(l=>{const m=l.match(DR);if(m&&!d){d=m[0];return l.replace(m[0],"").replace(/[|,–-]\s*$/,"").trim()}return l}).filter(Boolean);const org=b[1]&&!/^[-•*]/.test(b[1])?b[1]:"";return{role:b[0]||"",org,dates:d,desc:b.slice(org?2:1).join("\n")}})}
function parseText(t){const r=blank(),L=t.split(/\r?\n/).map(x=>x.trim());let m;
 if(m=t.match(/[\w.+-]+@[\w-]+\.[\w.-]+/))r.email=m[0];if(m=t.match(/\+?\d[\d\s().-]{8,}\d/))r.phone=m[0].trim();if(m=t.match(/(?:https?:\/\/)?(?:www\.)?linkedin\.com\/in\/[\w-]+\/?/i))r.link=m[0];
 const H={summary:/^(summary|profile|objective|about)/i,exp:/^(work |professional )?(experience|employment|work history)/i,edu:/^education/i,skills:/^(technical |key |core )?skills/i,proj:/^projects?/i};
 const isH=x=>x&&x.length<34&&(Object.values(H).some(h=>h.test(x))||(x===x.toUpperCase()&&/[A-Z]{4}/.test(x)&&!/\d|@/.test(x)));
 const pre=[],S2=[];let cur=null;L.forEach(x=>{if(isH(x)){const k=Object.keys(H).find(k=>H[k].test(x))||"x";cur={k,t:x.replace(/:$/,""),l:[]};S2.push(cur)}else if(cur)cur.l.push(x);else if(x)pre.push(x)});

 S2.forEach(s=>{if(s.k==="summary")r.summary=s.l.filter(Boolean).join(" ");else if(s.k==="skills")r.skills=s.l.join(", ").replace(/[•*]\s*/g,"").replace(/,\s*,/g,",");else if(s.k==="x")r.extra.push({t:s.t.replace(/\b(\w)(\w*)/g,(a,b,c)=>b.toUpperCase()+c.toLowerCase()),b:s.l.filter(Boolean).join("\n")});else r[s.k]=blocks(s.l)});return r}

const STOP=new Set("a an the and or of to in for with on at by from as is are be will we you our your this that these those it its their they them have has had can able including such etc more than into across within about who what which while also not all any new per using use work working team teams role roles years year experience required requirements preferred responsibilities strong good great plus must should ability skills skill knowledge looking join company candidate other well both only over like one two out up".split(" "));
const PH=["machine learning","data analysis","project management","product management","stakeholder management","a/b testing","power bi","customer success","cross-functional","problem solving","rest api","ci/cd","user research","financial modeling","deep learning","data visualization","stakeholder","agile","scrum","sql","python","java","javascript","typescript","react","node","aws","azure","docker","kubernetes","tableau","excel","figma","jira","seo","crm","kpi","roadmap","analytics","leadership","communication","budget","forecasting","automation","testing"];
function kw(jd){const t=jd.toLowerCase().replace(/[^a-z0-9+#./\s-]/g," "),m={};t.split(/\s+/).forEach(w=>{w=w.replace(/^[.\-/]+|[.\-/]+$/g,"");if(w.length<2||STOP.has(w)||/^\d+$/.test(w))return;m[w]=(m[w]||0)+1});
 PH.forEach(p=>{if(t.includes(p)){m[p]=(m[p]||0)+3;if(p.includes(" "))p.split(" ").forEach(w=>delete m[w])}});return Object.entries(m).sort((a,b)=>b[1]-a[1]).slice(0,28).map(x=>x[0])}
const rtext=r=>JSON.stringify(r).toLowerCase();

const ROLES={"Software engineer":"javascript,python,java,api,git,testing,cloud,aws,docker,sql,react,node,microservices,ci/cd,agile","Data analyst":"sql,python,excel,tableau,power bi,statistics,dashboards,visualization,a/b testing,reporting,etl","Data scientist":"python,machine learning,statistics,sql,pandas,modeling,nlp,tensorflow,experimentation,deep learning","Product manager":"roadmap,stakeholder,strategy,metrics,user research,agile,prioritization,launch,analytics,a/b testing","Digital marketer":"seo,sem,analytics,campaigns,content,social media,email,crm,conversion,google ads,branding","UX designer":"figma,prototyping,user research,wireframes,usability,design systems,accessibility","Business analyst":"requirements,stakeholder,sql,process improvement,documentation,jira,reporting,kpi","Project manager":"scope,budget,risk,stakeholder,agile,scrum,timeline,delivery,jira,planning","Financial analyst":"excel,financial modeling,forecasting,budgeting,reporting,variance,valuation,sql"};
function ats(r){const w=rtext(r).split(/\s+/).length,b=r.exp.concat(r.proj).flatMap(x=>x.desc.split("\n").filter(Boolean)),nb=b.filter(x=>/\d/.test(x)).length,av=b.filter(x=>/^(built|led|ran|cut|created|designed|launched|managed|improved|reduced|increased|developed|delivered|automated|analy[sz]ed|drove|owned|implemented|wrote|scaled|negotiated)/i.test(x.replace(/^[-•*]\s*/,""))).length;
 return[[/@/.test(r.email),"Email present"],[r.phone.length>6,"Phone present"],[r.summary.split(/\s+/).length>=20,"Summary of 20+ words"],[r.exp.length>0,"Experience section"],[r.edu.length>0,"Education section"],[skl(r).length>=6,"6+ skills listed"],[b.length>0&&nb>=3,"3+ bullets with numbers"],[b.length>0&&av/b.length>=.5,"Bullets start with action verbs"],[w>=250&&w<=900,`Length ${w} words (aim for 250–900)`],[S.tpl==="ats"||S.tpl==="classic"||S.tpl==="minimal","Single-column template parses best"]]}
